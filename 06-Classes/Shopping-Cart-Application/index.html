
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A JavaScript shopping cart application for browsing desserts and managing purchases.">
  <title>Sweet Treats | Shopping Cart</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <h1>Sweet Treats</h1>
      <p>Discover something delicious.</p>
    </div>

    <button id="cart-btn" class="cart-toggle btn" type="button">
      <span id="show-hide-cart">Show</span> Cart
      (<span id="total-items">0</span>)
    </button>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Our Dessert Collection</h2>
      <p>Choose your favorite desserts and add them to your cart.</p>
    </section>

    <section id="dessert-card-container" class="dessert-grid"
      aria-label="Available desserts">
    </section>

    <aside id="cart-container" class="cart-container"
      aria-label="Shopping cart">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button id="clear-cart-btn" class="btn clear-btn" type="button">
          Clear Cart
        </button>
      </div>

      <div id="products-container"></div>

      <div class="cart-summary">
        <p>Items: <span id="total-items">0</span></p>
        <p>Subtotal: <span id="subtotal">$0</span></p>
        <p>Taxes: <span id="taxes">$0</span></p>
        <p class="grand-total">Total: <span id="total">$0</span></p>
      </div>
    </aside>
  </main>

  <footer>
    <p>Built with HTML, CSS and JavaScript.</p>
  </footer>
</body>
</html>
